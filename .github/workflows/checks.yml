name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TF_CPP_MIN_LOG_LEVEL: '2'
      - name: Run the documented training and inference demo
        run: |
          python train.py --smoke-test --cpu --run-dir runs/ci-smoke
          python generate.py --run-dir runs/ci-smoke --output-dir runs/ci-preview --cpu --export-model
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TF_CPP_MIN_LOG_LEVEL: '2'
      - name: Save dataset-free demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-demo
          path: |
            runs/ci-smoke/config.json
            runs/ci-smoke/environment.json
            runs/ci-smoke/metrics.csv
            runs/ci-preview/generation.json
            runs/ci-preview/samples.png
          retention-days: 14
